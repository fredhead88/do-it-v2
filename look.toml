# look.toml — versioned defaults, read relative to each reader's repo root.
# [thresholds] is merged over look.DEFAULTS, which covers some keys; keys
# consumed elsewhere carry fallbacks at their readers. [window_gate],
# [merge_queue] and [admission] have their own readers and fallbacks
# (loadgate.DEFAULTS for admission). Missing or malformed config fails open.

[window_gate]
tree_guards = [
  "tests/test_820_no_abs_test_imports.py::",
  "tests/test_496_r3_guard.py::",
  "tests/test_207_monitoring_denoise.py::TestDigestFoldCronStale::test_query_cron_runs_stale_returns_data_trust_when_failed",
  "tests/deploy/test_ship_snapshot.py::test_ac14_line_counts",
  "tests/deploy/test_protected_stamp.py::test_ac12_deploy_sh_line_count_not_grown",
  "api/tests/profit_v2/test_read_model_refresh.py::test_ac9_deploy_sh_net_zero",
]
dispatch_timeout_min = 70
train_depth = 2
max_merges = 10

[merge_queue]
batch_cap = 10
batch_cap_floor = 6
window_target = 6

[thresholds]
tmp_high = 85
tmp_high_clear = 75
disk_high = 90
disk_high_clear = 85
tmp_climbing_slope = 10          # pts/hour, informational — the fill-projection below is what fires
tmp_climbing_full_within_h = 2
pass_budget_s = 90               # AC18's hard per-pass wall-clock budget
tmp_user_quota_pct = 80          # L-spec-0440 R9a/R9f: reap_tmp.user_quota()'s configured-fallback pct
grades_per_shipped_high = 1.5    # L-spec-0482/R12.d: fold.grades_per_shipped()'s 24h ratio alarm

[[prod]]
project = "albert-scott"
repo = "/opt/albert-scott"
ssh_target = "root@167.71.46.51"
base_url = "http://127.0.0.1:8000"   # loopback bind address; curl runs OVER ssh_target (deploy.sh:883,6490)
version_path = "/version"
health_path = "/health"

[pane_at_menu]
codex_patterns = []   # ships empty (Unknowns) — not load-bearing for this cut
# `codex_targets` (tmux target strings to capture) is this builder's own
# addition: `codex_patterns` alone has nothing to match against without a
# target list, and the spec's Produces names only the pattern list.
codex_targets = []

# L-charter-0038/L-spec-0389: the wall-clock checks (look_wallclock.py).
[[ci]]
project = "albert-scott"
repo = "/opt/albert-scott"
branch = "master"
workflows = []   # empty -> every distinct workflow name a push to `branch` ran, completed, trailing 7 days

[classes]
# condition -> class token, read by look_wallclock.fix_for() to name an
# in-flight corrective charter on a brief. Ships empty (Assumptions) — no
# look condition names a class yet.

# L-charter-0042/L-spec-0484, R13(c): the tick's push pass (push_origin.py)
# and look's own origin-behind alarm. `main` maps a project name to the
# branch the local tip is pushed onto; a project with no entry here
# resolves it from `origin/HEAD` at push time instead (push_origin.targets).
[push]
projects = ["do-it-v2", "albert-scott"]

[push.main]
do-it-v2 = "main"
albert-scott = "master"

[push.path]

[resources]
upload_manifest = "/opt/albert-scott/docs/do-it/ledger/upload-manifest.jsonl"


# Observe only. Global off reaches cron, Executor wait and direct run_steps
# callers at their next pass. DOIT_ADMISSION overrides this only in callers
# inheriting it; a crontab edit misses Executor panes and causes machine drift.
# A tracked off edit affects checkout cleanliness/worktree defaults; restore
# look.toml (or revert its commit) to undo it. No root-local off switch exists.
# Rollback: revert enforcement first, then this merge; saved state is inert.
[admission]
mode = "observe"
mem_floor_gb = 6
mem_hard_stop_gb = 8
mem_swap_hard_stop_gb = 12
mem_pressure_some_avg10_max = 5
mem_pressure_full_avg10_max = 1
load1_per_core_delay = 3
load1_per_core_stop = 4
running_peak_factor = 0.5
release_readings = 2
max_wait_min = 15
# These roles never pass through run_steps today; this is for other callers.
bypass_roles = ["executor", "tick", "look", "reaper", "cleaner"]

[admission.peak_gb]
window_gate = 0.9
builder = 0.5
grader = 0.6
reviewer = 0.4

[pane_watchdog]
dialog_text = "Background work is running"
capture_lines = 40
settle_s = 2
