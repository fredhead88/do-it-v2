<title>Realm of DO-IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --night:#0e0b1c; --glass:rgba(16,12,34,.82); --glass2:rgba(24,18,48,.92); --gold:#e6c46a; --gold2:#a8842e; --hair:rgba(230,196,106,.45);
  --paper:#efe6d2; --paper2:#d9cdb0; --ink:#2a2118; --ink2:#5a4d3c; --text:#efe6d2; --mute:#9a92ad; --red:#ff6a5c; --green:#8fe08f; --amber:#ffc46b; --blue:#7fc4ff;
  --display:'Cinzel',Georgia,serif; --body:'Noto Sans',system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 380px;grid-template-areas:"hud hud" "stage panel"}
.hud{grid-area:hud;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;grid-template-areas:"title stats" "row row";align-items:center;column-gap:22px;row-gap:4px;padding:8px 16px 6px;background:linear-gradient(#1a1430,#100c22);border-bottom:1px solid var(--hair);padding-top:calc(8px + env(safe-area-inset-top,0px));overflow:hidden}
.hud h1{grid-area:title;display:flex;align-items:center;gap:10px}
.mode{font-family:var(--display);font-size:9px;letter-spacing:.2em;padding:3px 8px;border:1px solid var(--hair);color:var(--mute);border-radius:2px;text-shadow:none;white-space:nowrap}
.mode.live{color:var(--green);border-color:var(--green)}.mode.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green);animation:pulse 1.4s ease-in-out infinite}
.mode.off{color:var(--red);border-color:var(--red)}
.stats{grid-area:stats;display:flex;gap:6px;overflow:hidden;white-space:nowrap;min-width:0}
.row{grid-area:row;display:flex;gap:14px;align-items:center;min-width:0;overflow:hidden}
.hud h1{font-family:var(--display);font-weight:800;font-size:15px;margin:0;color:var(--gold);letter-spacing:.18em;white-space:nowrap;text-shadow:0 0 12px rgba(230,196,106,.35)}
.hud .stat{display:flex;flex-direction:column;width:112px;flex:none;overflow:hidden}
.hud .stat b{font-family:var(--display);font-weight:800;font-size:14px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em;overflow:hidden;text-overflow:clip;height:20px;line-height:20px}
.hud .stat span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.16em}
.hud .stat.warn b{color:var(--amber)}.hud .stat.bad b{color:var(--red);text-shadow:0 0 10px rgba(255,106,92,.5)}.hud .stat.good b{color:var(--green)}
.hud .ctl{display:flex;gap:6px;align-items:center;flex:none}
.btn{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;padding:7px 11px;background:linear-gradient(#2a2250,#1a1436);color:var(--text);border:1px solid var(--hair);cursor:pointer;border-radius:2px}
.btn:hover{border-color:var(--gold);color:#fff}
.btn.on{background:linear-gradient(#e6c46a,#b8923a);color:#1a1230;border-color:#f2d98a}
.btn.live{border-color:var(--green);color:var(--green)}
.btn.live.on{background:linear-gradient(#8fe08f,#4fa34f);color:#0e2a0e;border-color:#b8f0b8}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.scrub{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:120px}
.scrub input{flex:1;accent-color:var(--gold);height:20px}
.scrub small{font-size:11px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.stage{grid-area:stage;display:grid;grid-template-rows:1fr auto;background:#07060f;overflow:hidden;min-width:0;min-height:0}
.view{position:relative;min-height:0;overflow:hidden}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
canvas#map.hand{cursor:pointer}
#status{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:6;background:var(--glass2);border:1px solid var(--hair);padding:14px 22px;font-family:var(--display);font-size:12px;letter-spacing:.16em;color:var(--gold);text-align:center;border-radius:2px;max-width:80%}
#status small{display:block;font-family:var(--body);font-size:12px;letter-spacing:0;color:var(--mute);margin-top:6px;text-transform:none}
#status.err{color:var(--red);border-color:var(--red)}
#tip{position:absolute;pointer-events:none;background:var(--glass2);color:#fff;border:1px solid var(--hair);padding:4px 10px;font-size:12px;letter-spacing:.04em;white-space:nowrap;transform:translate(-50%,-150%);display:none;z-index:3;border-radius:2px}
#bubble{position:absolute;z-index:4;width:300px;max-width:calc(100% - 24px);display:none;transform:translate(-50%,-100%);filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
#bubble .tag{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;color:#fff;background:#4a4650;padding:4px 18px;margin-left:10px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);position:relative;top:6px}
#bubble .box{background:linear-gradient(#f4ecda,#e4d8bd);color:var(--ink);border:2px solid #3a3430;padding:14px 16px 12px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);font-size:14px;line-height:1.45}
#bubble .box b{font-family:var(--display);font-size:12px;letter-spacing:.06em}
#bubble .box a{color:#7a2f18;text-decoration:underline;cursor:pointer;font-weight:600}
#bubble .box .tiny{font-size:12px;color:var(--ink2)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-12px;border:8px solid transparent;border-top:10px solid #3a3430;transform:translateX(-50%)}
.omens{position:absolute;left:12px;top:48px;z-index:3;width:min(330px,46%);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.omen{pointer-events:auto;background:var(--glass2);border:1px solid var(--hair);border-left:4px solid var(--amber);padding:6px 10px 6px 10px;cursor:pointer;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.omen.crit{border-left-color:var(--red);background:linear-gradient(90deg,rgba(90,20,30,.92),var(--glass2))}
.omen b{display:block;font-family:var(--display);font-size:11.5px;letter-spacing:.06em;color:#fff}
.omen.crit b{color:#ffb0a6}.omen.warn b{color:#ffd9a0}
.omen span{display:block;font-size:12.5px;color:#d9d2e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omen.head{background:var(--glass2);border:1px solid var(--hair);box-shadow:none;padding:4px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.omen.head small{font-family:var(--body);font-size:11px;color:var(--mute);letter-spacing:.04em}
.omens.min .omen:not(.head){display:none}
.omen.head b{font-size:10px;letter-spacing:.24em;color:var(--gold)}
.omen.quiet b{color:var(--green)}
.omen .loop{display:block;margin-top:3px;white-space:normal;line-height:1.1}
.omen .loop .lp{display:inline-block;padding:1px 5px;margin:2px 3px 0 0}
.lp{display:inline-block;font-family:var(--display);font-size:8.5px;letter-spacing:.1em;padding:1px 6px;border:1px solid var(--hair);border-radius:2px;margin:2px 4px 0 0;color:var(--mute)}
.lp.caught{color:var(--blue);border-color:var(--blue)}.lp.handled{color:var(--green);border-color:var(--green)}.lp.raised{color:var(--red);border-color:rgba(255,106,92,.5)}.lp.claimed{color:var(--mute)}.lp.notworking{color:var(--amber);border-color:var(--amber)}.lp.notworking-bad{color:var(--red);border-color:var(--red);background:rgba(255,106,92,.12)}.lp.chronic{color:#ffb0a6;border-color:#ffb0a6}.lp.age{color:var(--mute)}
.omen .tr{display:block;font-size:11.5px;margin-top:3px;color:#d9d2e6;font-variant-numeric:tabular-nums}.omen .tr.rising{color:#ffb0a6}.omen .tr.falling{color:#a8f0a8}.omen .tr.flat{color:#ffd9a0}
.omen .own{display:block;font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omen.seen{border-left-color:var(--blue)}.omen.ok{border-left-color:var(--green);opacity:.85}
.stage.alarm .view::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(255,90,70,.5),inset 0 0 60px rgba(255,60,40,.14)}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.stage.alarm .view::after{animation:none;opacity:.7}}
.cb{border:1px solid var(--hair);border-radius:3px;padding:10px 12px;margin:0 0 10px;background:rgba(255,255,255,.03);cursor:pointer}
.cb:hover{border-color:var(--gold)}
.cb .id{font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--gold)}
.cb .ti{font-size:13.5px;margin:2px 0 6px;line-height:1.3}
.cb .seg{display:flex;height:10px;border:1px solid var(--hair);overflow:hidden;background:rgba(255,255,255,.05);margin:4px 0}
.cb .seg i{display:block;height:100%}
.cb .cnt{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px}
.cb .hold{font-size:12.5px;margin-top:4px;color:#ffd9a0}
.cb .hold.ok{color:var(--green)}
.cb .hold.bad{color:#ffb0a6}
.proj{font-family:var(--display);font-size:11px;letter-spacing:.2em;color:var(--mute);margin:14px 0 8px}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mute);margin:6px 0 10px}
.key i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
#dossier{position:absolute;inset:0;z-index:7;background:#120d24;border:1px solid var(--gold2);box-shadow:0 20px 60px rgba(0,0,0,.6);overflow-y:auto;padding:22px 26px 30px;border-radius:3px}
#dossier[hidden]{display:none}
#dossier .top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;position:sticky;top:-22px;background:linear-gradient(180deg,rgba(22,16,44,.99),rgba(22,16,44,.96));padding:22px 0 10px;margin:-22px 0 0;z-index:2;border-bottom:1px solid var(--hair)}
#dossier .id{font-family:var(--display);font-size:12px;letter-spacing:.18em;color:var(--gold)}
#dossier h2{font-family:var(--body);font-weight:600;font-size:clamp(17px,1.7vw,22px);line-height:1.35;margin:6px 0 4px;color:#fff;max-width:70ch;text-wrap:balance}
#dossier .done{font-size:13.5px;color:var(--mute);max-width:80ch;margin:0 0 12px}
#dossier .verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;font-size:15px}
#dossier .verdict .big{font-family:var(--display);font-size:13px;letter-spacing:.1em;padding:6px 12px;border:1px solid var(--hair);border-radius:2px}
#dossier .verdict .big.ok{color:var(--green);border-color:var(--green)}#dossier .verdict .big.bad{color:var(--red);border-color:var(--red)}#dossier .verdict .big.warn{color:var(--amber);border-color:var(--amber)}
#dossier .btns{display:flex;gap:6px;flex:none}
#dossier .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:14px}
#dossier .breath{font-size:17px;line-height:1.55;max-width:78ch;margin:10px 0 14px;color:#f3eee6}
#dossier .breath b{color:#fff}
#dossier .needs{max-width:78ch}
#dossier .grp{margin:14px 0 6px}
#dossier .grp h4{display:flex;justify-content:space-between;align-items:baseline}
#dossier .grp h4 small{font-family:var(--body);font-size:12px;letter-spacing:0;color:var(--mute);text-transform:none}
#dossier .srow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px;align-items:baseline;cursor:pointer}
#dossier .srow:hover{background:rgba(255,255,255,.04)}
#dossier .srow .sid{font-family:var(--display);font-size:11px;letter-spacing:.06em;color:var(--gold)}
#dossier .srow .st{font-size:12px;color:var(--mute);white-space:nowrap}
#dossier .srow .sub{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
#dossier .srow b{font-weight:600;color:#fff}
#dossier .toggle{font-family:var(--display);font-size:10px;letter-spacing:.14em;background:none;border:1px solid var(--hair);color:var(--mute);padding:6px 10px;cursor:pointer;border-radius:2px;margin:8px 0}
#dossier .toggle:hover{color:#fff;border-color:var(--gold)}
#dossier .chartwrap[hidden]{display:none}
#dossier .steps{counter-reset:s;list-style:none;padding:0;margin:0;max-width:78ch}
#dossier .steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;padding:5px 0;font-size:14px;border-top:1px solid rgba(255,255,255,.06)}
#dossier .steps li::before{content:counter(s);font-family:var(--display);font-size:11px;color:var(--gold);padding-top:2px}
#dossier .steps time{color:var(--mute);font-size:12px;margin-right:6px}
.view.focus .omens,.view.focus .legend,.view.focus #bubble{display:none}
.stage.focus #log{display:none}
#tourcap{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(620px,calc(100% - 32px));z-index:8;display:none}
#tourcap .tag{display:inline-block;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;color:#fff;background:#4a4650;padding:4px 16px;margin-left:12px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);position:relative;top:6px}
#tourcap .box{background:linear-gradient(#f4ecda,#e4d8bd);color:var(--ink);border:2px solid #3a3430;padding:16px 18px 12px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);font-size:16px;line-height:1.5}
#tourcap .box .row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px}
#tourcap .box .row small{color:var(--ink2);font-size:12px}
#tourcap .box button{font-family:var(--display);font-size:10px;letter-spacing:.1em;padding:6px 10px;background:#3a3430;color:#fff;border:0;cursor:pointer;border-radius:2px;margin-left:6px}
#tourcap .box button.ghost{background:none;color:#3a3430;border:1px solid #3a3430}
#dossier .col h4{font-family:var(--display);font-size:10px;letter-spacing:.22em;margin:0 0 6px;color:var(--gold);border-bottom:1px solid var(--hair);padding-bottom:4px}
#dossier .col ul{margin:0;padding-left:16px;font-size:13.5px}#dossier .col li{margin:4px 0}
#dossier .col .act{border-left:3px solid var(--amber);padding:6px 10px;margin:6px 0;background:rgba(255,196,107,.06);font-size:13.5px}
#dossier .col .act.bad{border-left-color:var(--red);background:rgba(255,106,92,.07)}
#dossier .col .act b{display:block;font-family:var(--display);font-size:10.5px;letter-spacing:.08em;margin-bottom:2px}
#dossier .col .act .tiny{display:block;margin-top:3px}
#dossier .ms{list-style:none;padding:0;margin:0}
#dossier .ms li{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:3px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
#dossier .ms time{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px}
#dossier .ms li.bad span{color:#ff9a90}#dossier .ms li.good span{color:#a8f0a8}#dossier .ms li.esc span{color:#ffd28a}
#journey{display:block;width:100%;height:auto;border:1px solid var(--hair);background:rgba(0,0,0,.25);margin:10px 0 4px}
.jkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mute);margin:0 0 6px}.jkey i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
#dossier a.link{color:var(--gold);text-decoration:underline;cursor:pointer}
#dossier .wsh{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.relic{border:1px solid var(--hair);border-radius:3px;padding:10px 12px 10px 10px;background:rgba(255,255,255,.03);display:grid;grid-template-columns:64px 1fr;gap:10px;cursor:pointer;align-items:start}
.relic:hover{border-color:var(--gold)}
.relic canvas{width:64px;height:64px;image-rendering:pixelated;border-radius:3px;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.08),rgba(0,0,0,.35))}
.relic b{display:block;font-size:13.5px;line-height:1.3;color:#fff;margin-bottom:3px;overflow-wrap:anywhere}
.relic>div{min-width:0}
.relic .st{display:inline-block;font-family:var(--display);font-size:9px;letter-spacing:.12em;padding:2px 7px;border:1px solid var(--hair);border-radius:2px;margin:0 4px 4px 0}
.relic .w{font-size:12px;color:#c9c2d8;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.relic .m{font-size:11px;color:var(--mute);margin-top:4px}
.relic.trophy{background:linear-gradient(135deg,rgba(230,196,106,.12),rgba(255,255,255,.02));border-color:rgba(230,196,106,.45)}
.relic.dead{opacity:.6}
#banner{display:block;width:100%;height:auto;border:1px solid var(--hair);margin:8px 0 6px;image-rendering:pixelated}
.wstats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;margin:0 0 4px}.wstats b{font-family:var(--display);font-size:13px;color:#fff}
#dossier .intent-full{font-size:13.5px;color:#d9d2e6;max-width:90ch;margin:0 0 6px}
.chip.focus{border-color:var(--amber);color:var(--amber)}.chip.focus a{color:#fff;text-decoration:underline;cursor:pointer;margin-left:6px}
#log li.dim{opacity:.35}
.cb .lead{font-size:14.5px;color:#fff;margin:3px 0 4px;line-height:1.35}
.cb .ti{font-size:12px;color:var(--mute)}
@media (max-width:900px){#dossier{inset:6px;padding:14px}}
#stuck{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;max-width:min(760px,calc(100% - 24px));background:var(--glass2);border:1px solid var(--hair);border-left:4px solid var(--red);padding:6px 12px;font-size:13px;color:#f1e6c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px;pointer-events:auto;cursor:pointer}
#stuck.calm{border-left-color:var(--green)}
#stuck b{font-family:var(--display);font-size:10.5px;letter-spacing:.14em;color:#ffb0a6;margin-right:8px}
#stuck.calm b{color:var(--green)}
.view.focus #stuck{display:none}
.legend{position:absolute;right:12px;top:48px;z-index:2;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.chip{font-size:11px;letter-spacing:.06em;background:var(--glass);border:1px solid var(--hair);padding:3px 9px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:2px}
.chip:hover{border-color:var(--gold)}
.chip i{display:inline-block;width:9px;height:9px;border:1px solid #000;border-radius:1px}
#log{height:136px;background:linear-gradient(#100c22,#0b0818);border-top:1px solid var(--hair);padding:6px 14px;overflow-y:auto;z-index:2}
#log h3{font-family:var(--display);font-size:11px;letter-spacing:.2em;margin:0 0 4px;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
#log h3 button{font-family:var(--body);font-size:12px;background:none;border:0;color:var(--mute);cursor:pointer}
#log ul{list-style:none;margin:0;padding:0}
#log li{padding:2px 0;border-top:1px solid rgba(255,255,255,.05);cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;white-space:nowrap;overflow:hidden}
#log li span{overflow:hidden;text-overflow:ellipsis}
#log li:hover{background:rgba(255,255,255,.04)}
#log li time{color:var(--mute);font-variant-numeric:tabular-nums}
#log li .who{color:var(--gold)}
#log li.bad .who{color:var(--red)}#log li.good .who{color:var(--green)}#log li.esc .who{color:var(--amber)}#log li.ship .who{color:var(--blue)}
#log.min{height:32px;overflow:hidden}#log.min ul{display:none}
.panel{grid-area:panel;background:linear-gradient(180deg,#1a1434,#0f0b20);color:var(--text);overflow-y:auto;border-left:1px solid var(--hair);padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));position:relative;min-width:0}
.panel .close{display:block;position:absolute;right:10px;top:10px;font-family:var(--display);font-size:10px;letter-spacing:.1em;background:none;color:var(--mute);border:1px solid var(--hair);padding:5px 9px;cursor:pointer;border-radius:2px}
.panel .close:hover{color:#fff;border-color:var(--gold)}
#app.nopanel{grid-template-columns:1fr}#app.nopanel .panel{display:none}

function subjectPush(s,e){if(!s)return;if(!S.subjectEvents.has(s))S.subjectEvents.set(s,[]);S.subjectEvents.get(s).push(e);}
function placeSlot(pid){const p=PLACES[pid];if(!p||!p.yard)return{x:640,y:400};const used=S.slotUse[pid]||0;S.slotUse[pid]=used+1;const i=used%12;return{x:p.yard.x-110+(i%6)*44,y:p.yard.y+Math.floor(i/6)*40};}
function releaseSlot(pid){if(S.slotUse[pid])S.slotUse[pid]--;}
function pathLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].y-pts[i-1].y);return L;}
function pathAt(pts,d){for(let i=1;i<pts.length;i++){const seg=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].y-pts[i-1].y);if(d<=seg||i===pts.length-1){const k=seg?Math.min(1,d/seg):1;return{x:pts[i-1].x+(pts[i].x-pts[i-1].x)*k,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*k};}d-=seg;}return pts[pts.length-1];}
function setPath(a,pts){a.path=pts;a.pathT=0;a.pathDur=Math.max(.2,pathLen(pts)/(REDUCED?1e9:170));}
const roadY = pt => pt.y < 440 ? 330 : 640;
const dedupe = arr => arr.filter((p,i)=>i===0||p.x!==arr[i-1].x||p.y!==arr[i-1].y);
const toWork = (from,slot) => dedupe([from,{x:from.x,y:roadY(slot)===330?330:352},{x:640,y:roadY(slot)===330?330:352},{x:640,y:roadY(slot)},{x:slot.x,y:roadY(slot)},slot]);
const toFerry = from => dedupe([from,{x:from.x,y:roadY(from)},{x:640,y:roadY(from)},{x:640,y:480}]);

function reset(t){S.now=t;S.cursor=0;S.actors.clear();S.packets=[];S.effects=[];S.sparks=[];S.ravens=[];S.boats=[];S.shelf.clear();S.esc.clear();S.lastTick=null;S.lane=null;S.shipped=0;S.fails=0;S.done=0;S.failsBy={};S.spawnsBy={};S.doneBy={};S.subjectEvents.clear();S.log=[];S.verdicts={ok:0,no:0};S.reviews={full:0,gates:0};S.charters.clear();S.plans.clear();S.slotUse={};S.recent=[];S.vanished=[];S.alarms=[];S.look.clear();S.handled=[];S.closed.clear();S.raisedAt.clear();S.lastAct=0;$('log-ul').innerHTML='';}

function addLog(e,cls,who,text){const item={ms:e.ms,cls,who,text,s:e.s||e.sp};S.log.push(item);if(S.log.length>80)S.log.shift();if(!S.quiet)renderLogItem(item);}
function renderLog(){const ul=$('log-ul');ul.innerHTML='';for(const it of S.log.slice(-40))renderLogItem(it);}
function renderLogItem(it){const ul=$('log-ul');const li=document.createElement('li');li.className=(it.cls||'')+(inFocus(it.s)?'':' dim');li.innerHTML=`<time>${fmt(it.ms).slice(6)}</time><span><span class="who">${esc(it.who)}</span> ${esc(it.text)}</span>`;li.onclick=()=>openSubject(it.s);ul.prepend(li);while(ul.children.length>40)ul.lastChild.remove();}
function spawnActor(e,role){const sp=e.sp;if(!sp||S.actors.has(sp))return;const wp=WORK[role]||'tower';const slot=placeSlot(wp);const origin=PLACES[DISPATCHER[role]||'tower'];
  const a={sp,role,subject:e.s,start:e.ms,x:470+(qcount++%6)*24,y:300,slot,wp,state:'queued',path:null,pathT:0,pathDur:1,bubble:null,bubbleT:0,until:e.ms+5*60000,prj:e.pr,claimed:e.cl?toMs(e.cl):null};
  if(a.claimed&&a.claimed>a.start)a.until=Math.min(a.claimed,a.start+300000);
  S.actors.set(sp,a);S.spawnsBy[role]=(S.spawnsBy[role]||0)+1;
  if(S.quiet){a.state='working';a.x=slot.x;a.y=slot.y;}else if(origin&&origin.yard)S.packets.push({x:origin.yard.x,y:origin.yard.y,tx:550,ty:400,t:0,dur:.9,sp});}
function finishActor(sp,ok,why){const a=S.actors.get(sp);if(!a)return;a.done=true;if(S.quiet){S.actors.delete(sp);releaseSlot(a.wp);return;}
  if(ok){a.state='leaving';a.bubble='check';a.bubbleT=1.2;setPath(a,toFerry({x:a.x,y:a.y}));}
  else{a.state='dying';a.bubble='skull';a.bubbleT=2.5;const k=monsterFor(why);S.effects.push({kind:'monster',m:k,x:a.x+34,y:a.y-10,t:0,dur:3,sp});}}
function process(until){
  while(S.cursor<EVENTS.length&&EVENTS[S.cursor].ms<=until){handle(EVENTS[S.cursor++]);}
  for(const [sp,a] of S.actors){if(a.done)continue;const cap=(CAP[a.role]||30)*60000;if(until-a.start>cap*3){a.done=true;if(S.quiet){S.actors.delete(sp);releaseSlot(a.wp);}else{a.state='dying';a.bubble='q';a.bubbleT=2.5;addLog({ms:until,s:a.subject,sp},'bad',sp,`vanished: no spawn-done or spawn-failed was ever written for ${a.subject}`);}S.vanished.push({ms:until,sp});}}
}
function handle(e){const ty=e.ty;if(ty!=='tick')subjectPush(e.s,e);if(e.a==='executor'&&ty!=='tick')S.lastAct=Math.max(S.lastAct||0,e.ms);if(e.sp&&e.sp!==e.s)subjectPush(e.sp,e);
  const spark=pid=>{if(S.quiet||S.sparks.length>160||REDUCED)return;const p=PLACES[pid];if(!p)return;S.sparks.push({x:p.x+p.w/2,y:p.y+p.h/2,t:0});};
  const roleA=actorRole(e.a);
  switch(ty){
    case 'tick':S.lastTick=e.ms;S.lane=e.ln;if(!S.quiet&&!REDUCED)S.bell=1;break;
    case 'spawn-started':{const r=e.r;if(!r||!WORK[r])break;spawnActor(e,r);addLog(e,'',e.sp,`sets out for the ${PLACES[WORK[r]].n}: ${e.s||'?'}`);spark(DISPATCHER[r]||'tower');break;}

function guideHtml(){return `<h2>Realm of DO-IT</h2><div class="cls">${LIVE?'live from the ledger':'a replay of the ledger'}</div><p>Your pipeline as an overworld. Every sprite that walks is a real spawn id; every scroll, raven and boat is a ledger event.${LIVE?' New events arrive as they are appended; the clock is now.':' <b>This copy is a snapshot.</b> The live view is <code>doit realm</code> on the box that holds the ledger, at http://127.0.0.1:8642.'}</p><p>New here? Press <b>TOUR</b> for a walkthrough on the map itself.</p><h4>HOW TO READ IT</h4><ul><li><b>North terrace</b> is thinking: Keep, Observatory, Map Hall, Scriptorium, Chapel. <b>South plaza</b> is building: Forge, Court, Inn, Gate, Harbor, Prod Town.</li><li>Every sub-agent is a seat packet that must cross <b>the Ferry</b>. A sleeping sprite on the quay is a packet nobody has claimed.</li><li>Scrolls stacked at the <b>Watchtower</b> are specs written but not yet dispatched. That stack is the wall-clock you pay.</li><li>A raven flying to the <b>Keep</b> is an escalation. It flies back on a decision. A burning beacon means one is open.</li><li>The bar over a working sprite is elapsed time against its cap. Windows glow where someone is working. Light follows your local clock.</li></ul><h4>STUCK NOW</h4><p>The strip at the top of the map, and the sweating scrolls at each door, are the specs sitting between steps this very minute. Red means the wait did not have to happen: the Executor, the ferry, the gate or the deploy should have moved it. Amber means it waits on you. Click a scroll for the story.</p><h4>OMENS</h4><p>Each omen now shows its loop: RAISED (only the page sees it), CAUGHT (look filed a brief; a blue raven flies to the Observatory's triage lane), HANDLED (the Thinker's decision or lesson, or look clearing it; a green raven flies back). Four map features carry their own omens: the store room beside the Forge fills with crates as the root disk fills, a ship sits in the harbor when merges are not running, letters pile beside the Chapel while inbound PRs wait for a carry, and the Keep's bell hangs unrung while a charter is ready to close.</p><p>The top-left stack is the failure watch: a dead Executor, unclaimed packets, runs near their cap, contamination deadlocks, grader churn, an aging shelf, overdue ravens, BLOCKED builders, a held merge gate, owed evidence, a bad cut, a failure spike, vanished runs, a swollen lane. Each is anchored on the map with a marker; click it for why and what to do.</p><h4>CHARTERS</h4><p>The CHARTERS button is the work itself: every charter by project, its specs as a bar by state, and one line on where it is holding.</p><h4>CLICK</h4><ul><li>A character or building: a word bubble, then the codex.</li><li>A chronicle line: the subject's whole story.</li><li>Census: every subject by derived state.</li></ul><h4>THE THREE NUMBERS</h4><ul><li><b>Executor</b>: time since the last bell. Over 5 min, the pane is dead.</li><li><b>Shelf</b>: specs waiting for a builder, and the oldest wait.</li><li><b>Fallen</b>: failures over total, and the monster says why.</li></ul><p class="tiny">${LIVE?'Scrub to replay; LIVE returns to now.':'Scrub with the slider; speeds are ledger minutes per real second.'}</p>`;}
$('b-help').onclick=()=>openPanel(guideHtml());$('b-tour').onclick=startTour;$('b-clock').onclick=openClock;
try{if(localStorage.getItem('realm.omens')==='min')$('omens').classList.add('min');}catch(_){}
(function legend(){const L=$('legend');for(const [r,c] of [['builder','#b8763a'],['grader','#6b4bb8'],['reviewer','#48b062'],['spec-writer','#4a7ce0'],['spec-auditor','#7a7a96'],['plan-auditor','#9a844a'],['probe','#c9a25a'],['charter-reviewer','#c4cad8']]){const d=document.createElement('div');d.className='chip';d.innerHTML=`<i style="background:${c}"></i>${ROLE_NAME[r]}`;d.onclick=()=>openRole(r);L.appendChild(d);}})();
$('b-play').onclick=()=>{if(!LIVE&&S.now>=T1){seek(T0);S.playing=true;}else S.playing=!S.playing;};
for(const b of document.querySelectorAll('.spd'))b.onclick=()=>{S.speed=+b.dataset.s;document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('on',x===b));if(LIVE){LIVE=false;}};
let scrubbing=false;const sc=$('scrub');
sc.addEventListener('input',()=>{scrubbing=true;const t=T0+(T1-T0)*sc.value/1000;$('h-clock').textContent=fmt(t)+' Z';});
sc.addEventListener('change',()=>{const t=T0+(T1-T0)*sc.value/1000;if(stream||REMOTE)LIVE=false;seek(t);S.playing=true;scrubbing=false;});
$('b-live').onclick=()=>{if(!stream&&!REMOTE)return;LIVE=true;S.playing=true;T1=Date.now();seek(Date.now());};
$('log-min').onclick=()=>{const l=$('log');l.classList.toggle('min');$('log-min').textContent=l.classList.contains('min')?'show':'hide';};
addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;if(tour){if(ev.key===' '||ev.key==='ArrowRight'){ev.preventDefault();showTourStep(tour.i+1);}else if(ev.key==='ArrowLeft'){showTourStep(tour.i-1);}else if(ev.key==='Escape')endTour();return;}if(ev.key===' '){ev.preventDefault();$('b-play').click();}if(ev.key==='Escape'){if(!$('dossier').hidden)closeDossier();else{$('p-close').click();hideBubble();}}});

/* ---------------- boot: live stream, or embedded snapshot ---------------- */
let stream=null;
/* a key on the address is kept for this browser and sent with every request */
let KEY='';try{const u=new URL(location.href);if(u.searchParams.get('key')){KEY=u.searchParams.get('key');localStorage.setItem('realm.key',KEY);u.searchParams.delete('key');history.replaceState(null,'',u.pathname+u.hash);}else KEY=localStorage.getItem('realm.key')||'';}catch(_){}
const BASE=location.pathname.replace(/\/[^/]*$/,'');/* works at / and behind a proxy prefix such as /realm/ */
const api=path=>BASE+path+(KEY?(path.includes('?')?'&':'?')+'key='+encodeURIComponent(KEY):'');
function loadData(d){DATA=d;if(d.caps)CAP={...CAP,...d.caps};EVENTS=d.events.map(e=>({...e,ms:toMs(e.t)})).filter(e=>e.ms).sort((a,b)=>a.ms-b.ms);T0=toMs(d.window[0]);T1=d.live?Date.now():toMs(d.window[1])+60000;$('s-a').textContent=fmt(T0);$('s-b').textContent=fmt(T1);}
function insertEvent(row){const e={...row,ms:toMs(row.t)||Date.now()};let i=EVENTS.length;while(i>0&&EVENTS[i-1].ms>e.ms)i--;EVENTS.splice(i,0,e);if(i<S.cursor)S.cursor++;// arrived out of order behind the cursor: handle now
  if(i<S.cursor-1){handle(e);}}
let seq=0,heard=false,pollTimer=null;
function applyBatch(d){if(d.seq!=null)seq=d.seq;for(const row of d.ledger||[]){insertEvent(row);if(LIVE)T1=Date.now();}for(const c of d.claims||[]){const a=S.actors.get(c.sp);if(a&&!a.claimed){a.claimed=toMs(c.cl);a.until=Math.min(a.until,Math.max(a.start,a.claimed));}}if(d.states&&DATA){DATA.states=d.states;DATA.seat=d.seat||DATA.seat;S.lastStates=Date.now();}}
async function pollOnce(){try{const r=await fetch(api('/api/since?seq='+seq),{cache:'no-store'});if(!r.ok)return false;applyBatch(await r.json());$('h-clock-l').textContent='live · polling';return true;}catch(_){return false;}}
function startPolling(why){if(pollTimer)return;console.log('realm: stream '+why+', polling every 4 s instead');if(stream){try{stream.close();}catch(_){}}pollTimer=setInterval(pollOnce,4000);pollOnce();}
function connect(){stream=new EventSource(api('/api/stream'));
  setTimeout(()=>{if(!heard)startPolling('delivered nothing in 8 s (a proxy is buffering it)');},8000);
  stream.addEventListener('hello',ev=>{heard=true;try{const d=JSON.parse(ev.data);if(d.seq!=null&&!seq)seq=d.seq;}catch(_){}});
  stream.addEventListener('ledger',ev=>{const row=JSON.parse(ev.data);insertEvent(row);if(LIVE)T1=Date.now();});
  stream.addEventListener('claim',ev=>{const {sp,cl}=JSON.parse(ev.data);const a=S.actors.get(sp);if(a&&!a.claimed){a.claimed=toMs(cl);a.until=Math.min(a.until,Math.max(a.start,a.claimed));}});
  stream.addEventListener('states',ev=>{const d=JSON.parse(ev.data);if(DATA){DATA.states=d.states;DATA.seat=d.seat;}S.lastStates=Date.now();});
  stream.addEventListener('heartbeat',()=>{$('h-clock-l').textContent='live · now';});
  stream.addEventListener('sys',ev=>{S.sys=JSON.parse(ev.data);});
  stream.addEventListener('history',ev=>{const d=JSON.parse(ev.data);S.history=d.history;if(d.wallclock)S.wallclock=d.wallclock;});
  stream.addEventListener('tick_omens',ev=>{S.tickOmens=JSON.parse(ev.data);});
  stream.onerror=()=>{$('h-clock-l').textContent='live · reconnecting';if(!heard)startPolling('failed to open');};}
let REMOTE=false,remoteTimer=null,lastPush='';
async function remoteFetch(file){const r=await fetch(api('/api/ledger?file='+file),{cache:'no-store'});if(r.status===401)return {auth:false};if(!r.ok)return null;const d=await r.json();d.pushedAt=r.headers.get('X-Pushed-At')||'';return d;}
function passwordForm(msg){openPanel(`<h2>Realm of DO-IT</h2><div class="cls">this realm is behind a password</div><p>${esc(msg||'Enter the password to open the realm.')}</p><form id="pwf"><input id="pw" type="password" autocomplete="current-password" placeholder="password" style="width:100%;padding:8px 10px;font-family:var(--body);font-size:15px;background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--hair);border-radius:2px"><p style="margin-top:8px"><button class="btn on" type="submit">ENTER</button></p></form>`);status('A PASSWORD IS NEEDED','enter it in the panel');
  $('pwf').onsubmit=async ev=>{ev.preventDefault();const pw=$('pw').value;try{const r=await fetch(api('/api/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});if(r.ok){status('WAKING THE REALM','fetching the last snapshot…');boot();}else passwordForm('That was not it. Try again.');}catch(_){passwordForm('Could not reach the login. Try again.');}};}
function applySnapshot(d){if(!DATA){return false;}let lastT='';for(const e of EVENTS)if(e.t>lastT)lastT=e.t;let n=0;for(const row of d.events){if(row.t>lastT){insertEvent(row);n++;}}for(const k of ['states','seat','stats','titles','counts','queue','charters','spec_charter','makers','n_events','sys','tick_omens','history','specs','wallclock'])if(d[k]!=null)DATA[k]=d[k];if(d.wallclock)S.wallclock=d.wallclock;if(d.history)S.history=d.history;if(d.sys)S.sys=d.sys;if(d.tick_omens)S.tickOmens=d.tick_omens;S.lastStates=Date.now();lastPush=d.pushedAt||d.now||'';T1=Date.now();return n;}
async function remotePoll(){const d=await remoteFetch('snapshot');if(!d||d.auth===false)return;applySnapshot(d);}
let booted=false;
async function boot(){
  let d=null;if(!booted){booted=true;requestAnimationFrame(loop);}
  try{status('WAKING THE REALM','asking the server for the last 24 hours…');const r=await fetch(api('/api/bootstrap'),{cache:'no-store'});if(r.ok){status('WAKING THE REALM','reading the ledger…');d=await r.json();}else if(r.status===401){status('KEY NEEDED','open the address doit realm printed, with ?key= on it',true);openPanel('<h2>Key needed</h2><p>This realm is served with a key. Open the address that <code>doit realm --public</code> printed, which carries <code>?key=…</code>; this browser will remember it.</p>');requestAnimationFrame(loop);return;}}catch(_){}
  if(!d){try{const rd=await remoteFetch('snapshot');if(rd&&rd.auth===false){passwordForm();return;}if(rd){d=rd;REMOTE=true;}}catch(_){}}
  if(!d){try{d=JSON.parse(document.getElementById('ledger').textContent);}catch(_){}}
  if(!d){status('NO LEDGER REACHED','the server did not answer and this copy has no snapshot',true);openPanel('<h2>No ledger</h2><p>Run <code>doit realm</code> on the box that holds <code>~/.do-it</code> and open the address it prints. This copy has no embedded snapshot.</p>');return;}
  status('WAKING THE REALM',`replaying ${d.events.length.toLocaleString()} events…`);await new Promise(r=>setTimeout(r,20));loadData(d);
  if(d.live){LIVE=true;seek(Date.now());connect();document.querySelectorAll('.spd').forEach(x=>x.classList.remove('on'));}
  else if(REMOTE){LIVE=true;lastPush=d.pushedAt||d.now||'';T1=Date.now();seek(Date.now());$('b-live').style.display='';if(!remoteTimer)remoteTimer=setInterval(remotePoll,45000);document.querySelectorAll('.spd').forEach(x=>x.classList.remove('on'));}
  else{LIVE=false;$('b-live').style.display='none';const dayStart=Date.UTC(new Date(T1).getUTCFullYear(),new Date(T1).getUTCMonth(),new Date(T1).getUTCDate());const t=dayStart>T0&&dayStart<T1?dayStart:T0;seek(t);}
  computeOmens();openCharters();status(null);
}
boot();
</script>
