# grading.toml — L-spec-0481, charter L-charter-0042 R12.7. The ONLY source
# of `db_env`, `db_setup`, `node_dirs`, `venv` for a project's grading
# capabilities (Constraints) — spec/verify text contributes capability NAMES
# only, never an argv element, path, or env value. Read relative to
# `grading_env.py`'s own path (repo root), not $DOIT_ROOT — a versioned
# default that ships with the code, matching `look.toml`/`problems.toml`'s
# own precedent. A project absent here gets no `db`/`node_modules`
# provisioning at all (`grading_env._project_row` returns `{}`).
#
# `db_setup.argv` may use the literal token `{venv}`, substituted at
# preflight time with `<checkout>/<venv>` for the project being graded —
# never a shared, hardcoded path (the checkout differs per `--project`).

[project.albert-scott]
db_env = ["SUPABASE_DB_URL", "DATABASE_URL", "PG_PARITY_DB_URL"]
node_dirs = ["dashboard"]
# Absolute: the checkout (~/.do-it/repos/albert-scott) is a symlink to
# /opt/albert-scott, and the venv's script shebangs name the real path, which is
# the path the sandbox must bind.
venv = "/opt/albert-scott/.venv"

[project.albert-scott.db_setup]
argv = ["{venv}/bin/alembic", "-c", "alembic_supabase.ini", "upgrade", "head"]
cwd = "api"

[project.do-it-v2]
# Thinker 2026-10-09: do-it-v2 had no grading row, so any spec whose text names
# pytest (even in prose: grading_env scans spec_text + verify_text) failed the
# `tools` preflight with "pytest --version" in the bwrap view (L-spec-0185 on
# 10-04, L-spec-0765 on 10-08/09). Absolute path for the same reason as
# albert-scott's row: ~/.do-it/repos/do-it-v2 is a symlink to /home/albert/do-it-v2.
venv = "/home/albert/do-it-v2/.venv"
