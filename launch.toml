# launch.toml — one [roles.<role>] table per standing role: which ambient
# credential NAMES that role's child must never inherit, which rules file is
# its standing contract, and (never by default — SD23) a `model` an operator
# pins later by hand. `doit up`/`doit relay`/the Executor loop read planner/
# relay/executor's own tables through src/launch.py; `doit launch codex` is
# the one CLI surface this file gives a fourth standing role that had none
# (L-charter-0036 R2).
#
# No table sets `model`. A `model = "..."` key added by hand is the ONLY
# source `--model` is ever drawn from — never a silent repin off models.toml.

[roles.planner]
strip = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
rules = "agents/planner.md"

[roles.relay]
strip = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GH_TOKEN", "GITHUB_TOKEN"]
set = { GH_CONFIG_DIR = "$HOME/.config/gh-none" }
rules = "agents/relay.md"

[roles.executor]
strip = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
rules = "agents/executor.md"

[roles.codex]
strip = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
rules = "/opt/albert-scott/AGENTS.md"
cwd = "/opt/albert-scott"
