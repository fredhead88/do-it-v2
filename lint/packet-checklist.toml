# lint/packet-checklist.toml — append-only, versioned, severity-graded packet
# lint (L-spec-0273 / L-charter-0033, SD9/SD15/SD21). A new recurring packet
# defect is closed by adding ONE [[entry]] row here plus one check function in
# src/packet_lint.py — never by hand-patching an existing bucket.
#
# {id, since, applies_to, check, message, severity}
#   applies_to — exactly "spec" or "packet:<role>". One value, never a list.
#   severity   — "warn" or "block".
#
# A row's EFFECTIVE severity is "block" when a [[promotion]] row below names
# its id, else the row's own severity. Promoting an existing row from
# advisory to blocking costs one new [[promotion]] row — never editing this
# row (append-only) and never a code change.
#
# PL-001..PL-009 all ship severity="warn". No [[promotion]] row exists yet,
# so every one's effective severity is "warn" today (AC2).

[[entry]]
id = "PL-001"
since = "2026-09-24"
applies_to = "spec"
check = "check_base_sha_head"
message = "base_sha is the literal string HEAD, not a pinned commit"
severity = "warn"

