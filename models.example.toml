# models.toml — the model map: contract → backend → model, decided ONCE per ledger root.
#
# Copy to $DOIT_ROOT/models.toml (install.sh does, if none is there). Read by
# `doit dispatch`, `doit tick`, and the wrapper's end-of-spawn poke. Environment
# variables (DOIT_SEAT, DOIT_NO_POKE) may only AGREE with this file — a per-shell
# variable stood in for this ruling once and the tick ran `claude -p` twice on a
# root that bans it (pilot S32, $2.09 metered, three 30-minute unserved spawns).
#
# backends
#   pane      a standing interactive session the operator opens; never dispatched
#   seat      an interactive session's Agent-tool sub-agent (seat-billed; the
#             wrapper writes the packet and waits — `doit dispatch --seat`)
#   claude-p  `claude -p --agent <role>` (metered on some plans — banned on the
#             Albert Scott root, spec 572)
#   codex     `codex exec` on the ChatGPT plan, OPENAI_API_KEY stripped
#
# rules the loader enforces
#   * claude-fable-* is pane-only: the Agent tool substitutes Sonnet for it
#     silently, and a map that names Fable on any other backend is a lie.
#   * thinker and planner are pane-only; executor is pane or claude-p (the tick).
#   * every terminal event stamps model_requested (this file) beside model_used
#     (what the backend reported), and `first_on_model` marks the D120 trust run
#     of a (contract, model) pair.
#   * `fallback = { backend, model }` on a contract is the ONE re-dispatch the
#     wrapper makes when the primary backend refuses for its own reason (a Codex
#     weekly limit). It is stamped `backend_fallback: true`. Never a pane.
#   * `doit models use mixed|claude-only` swaps this file; `doit models show` prints it.
#
# the argued map (2026-09-15 retro; see docs/handoffs/pilot-retro-change-list.md)
#   * a judge never shares its author's vendor: spec-writer/builder on Codex ⇒
#     spec-auditor/grader on Claude. Blindness by construction, one level up.
#   * Opus is nobody's default (operator ruling); it is the named fallback for a
#     judging contract whose Sonnet run measurably drops findings.
#   * reviewer/charter-reviewer on Codex are provisional until the 2026-09-15
#     client walkthrough report says Codex + repo-venv Playwright drives the
#     deployed thing; fallback is seat + claude-sonnet-5.

[defaults]
backend = "seat"

[contracts.thinker]
backend = "pane"
model = "claude-fable-5-1"

[contracts.planner]
backend = "pane"
model = "claude-fable-5-1"

[contracts.executor]
backend = "pane"            # under a seat-only root the driver pane IS the Executor (S2)
model = "claude-sonnet-5"   # "dumb and fast" by contract; whoever drives the pane

[contracts.grader]
backend = "seat"
model = "claude-sonnet-5"   # fallback: claude-opus-5

[contracts.spec-auditor]
backend = "seat"
model = "claude-sonnet-5"   # fallback: claude-opus-5

[contracts.plan-auditor]
backend = "seat"
model = "claude-sonnet-5"   # fallback: claude-opus-5

[contracts.spec-writer]
backend = "codex"
model = "gpt-6-astra"
fallback = { backend = "seat", model = "claude-sonnet-5" }   # when Codex refuses on its limit

[contracts.builder]
backend = "codex"
model = "gpt-6-astra"
fallback = { backend = "seat", model = "claude-sonnet-5" }   # when Codex refuses on its limit

[contracts.probe]
backend = "codex"
model = "gpt-6-astra"
fallback = { backend = "seat", model = "claude-sonnet-5" }   # when Codex refuses on its limit

[contracts.reviewer]
backend = "codex"           # provisional — see header
model = "gpt-6-astra"
fallback = { backend = "seat", model = "claude-sonnet-5" }   # when Codex refuses on its limit

[contracts.charter-reviewer]
backend = "codex"           # provisional — see header
model = "gpt-6-astra"
fallback = { backend = "seat", model = "claude-sonnet-5" }   # when Codex refuses on its limit

[contracts.research]
backend = "seat"
model = "claude-haiku-4-5-20251001"

[contracts.reuse-scout]
backend = "seat"
model = "claude-sonnet-5"

# [weights] — retro step 9 (operator ask, 2026-09-15). Price ratios per model,
# relative to input=1.0, that fold.py's SPEND block and `doit spend` use to
# render an input-equivalent WEIGHTED TOKEN total (never a dollar figure —
# §4.2's budgets are token counts). Optional: a model missing here renders
# unweighted, not zero-weighted. The four numbers below are Claude's public
# per-token price ratios (output ~5x input; a cache read ~0.1x; a cache write
# ~1.25x, the 5-minute ephemeral tier) and are used here for EVERY model named
# in this map, gpt-6-astra included — Astra's own vendor ratios were not looked
# up for this pass, so its weighted figure is a placeholder on Claude's curve,
# not a verified Codex price. Flagged for the operator; replace when real
# GPT-6 Astra ratios are available.
[weights.claude-fable-5-1]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[weights.claude-sonnet-5]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[weights.claude-opus-5]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[weights.claude-haiku-4-5-20251001]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[weights.gpt-6-astra]           # placeholder — Claude's ratios, not Astra's own (see note above)
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25
