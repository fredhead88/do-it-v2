# crons.toml — the builder-box cron manifest (L-spec-0318, L-charter-0036 R4/R3).
#
# One [[row]] per job this box needs running. `where = "user"` rows live in the
# personal crontab (`crontab -l`) and are checkable AND installable by this
# tool; `where = "cron.d"` rows live under /etc/cron.d, need root, and are
# print-only here (SD6) — `doit crons install` refuses them.
#
# Substitution tokens, applied textually to `schedule`, `command`, `path`
# wherever they occur (src/crons.py's `_tokens()`):
#   {doit}     this repo's doit, absolute (symlink-resolved)
#   {repo}     {doit}'s parent
#   {root}     str(fold.ROOT), read live at call time
#   {tick_min} os.environ.get("DOIT_TICK_MIN", "5")
#
# `sig` is a regex (TOML literal string — no escape processing) used to detect
# an already-installed line for this row; it is matched against non-commented
# lines only.
#
# Every command below is wrapped in `{doit} cron-run <name> -- ` (R14a,
# L-spec-0485): an env-assignment prefix (e.g. `DOIT_ROOT={root}`) stays
# BEFORE the wrapper so the child still inherits it, and any redirect stays at
# the line's end, unmoved — `cron-run` inherits CMD's stdout directly and
# tees its stderr, so the same `>> file 2>&1` still captures the same output
# it always did.

[[row]]
name = "tick"
where = "user"
schedule = "*/{tick_min} * * * *"
command = "DOIT_ROOT={root} {doit} cron-run tick -- {doit} tick >> {root}/logs/tick.log 2>&1"
path = "{doit}"
sig = '\bdoit tick\b'
owner = "thinker"
project = "do-it-v2"

[[row]]
name = "look"
where = "user"
schedule = "*/10 * * * *"
command = "{doit} cron-run look -- {doit} look >> {root}/logs/look.log 2>&1"
path = "{doit}"
sig = '\bdoit look\b'
owner = "thinker"
project = "do-it-v2"

[[row]]
name = "tmp-reaper"
where = "user"
schedule = "*/5 * * * *"
command = "{doit} cron-run tmp-reaper -- {doit} reap-tmp"
path = "{doit}"
sig = '\bdoit reap-tmp\b'
owner = "thinker"
project = "do-it-v2"

[[row]]
name = "lessons-digest"
where = "user"
schedule = "7 * * * *"
command = "{doit} cron-run lessons-digest -- {repo}/scripts/lessons_digest.py >> {root}/lessons-digest.log 2>&1"
path = "{repo}/scripts/lessons_digest.py"
sig = 'lessons_digest\.py\b'
owner = "thinker"
project = "do-it-v2"

[[row]]
name = "backup-watch"
where = "user"
schedule = "* * * * *"
command = "{doit} cron-run backup-watch -- {doit} backup watch --for 60 >> {root}/backup.log 2>&1"
path = "{doit}"
sig = '\bdoit backup watch\b'
owner = "thinker"
project = "do-it-v2"
max_runtime_s = 90

[[row]]
name = "ledger-snapshot"
where = "user"
schedule = "*/10 * * * *"
command = "{doit} cron-run ledger-snapshot -- /var/backups/do-it/snapshot.sh >/dev/null 2>&1"
path = "/var/backups/do-it/snapshot.sh"
sig = 'snapshot\.sh\b'
owner = "thinker"
project = "do-it-v2"

[[row]]
name = "sweep-owed"
where = "user"
schedule = "*/30 * * * *"
command = "{doit} cron-run sweep-owed -- {doit} sweep-owed >> {root}/logs/sweep-owed.log 2>&1"
path = "{doit}"
sig = '\bdoit sweep-owed\b'
owner = "thinker"
project = "do-it-v2"

[[row]]
name = "verify-owed"
where = "user"
schedule = "0 */2 * * *"
command = "{doit} cron-run verify-owed -- {doit} verify-owed >> {root}/logs/verify-owed.log 2>&1"
path = "{doit}"
sig = '\bdoit verify-owed\b'
owner = "thinker"
project = "do-it-v2"

[[row]]
name = "auto-deploy"
where = "cron.d"
schedule = "*/5 * * * *"
command = "albert {doit} cron-run auto-deploy -- /opt/albert-scott/venv/bin/python /opt/albert-scott/scripts/ops/auto_deploy.py --once >> /var/log/albert-scott/auto-deploy-run.log 2>&1"
path = "/opt/albert-scott/venv/bin/python"
sig = 'auto_deploy\.py\b.*--once\b'
owner = "deployer"
project = "albert-scott"

[[row]]
name = "owed-digest"
where = "user"
schedule = "0 6 * * *"
command = "{doit} cron-run owed-digest -- {doit} owed-digest --alert >> {root}/logs/owed-digest.log 2>&1"
path = "{doit}"
sig = '\bdoit owed-digest(?: --alert)?(?=\s*>>|\s*(?:#.*)?$)'
owner = "thinker"
project = "do-it-v2"

[[row]]
name = "portal-latency-daily"
where = "cron.d"
schedule = "30 6 * * *"
command = "albert {doit} cron-run portal-latency-daily -- /bin/bash /opt/albert-scott/scripts/deploy/portal_check_daily_wrapper.sh"
path = "/opt/albert-scott/scripts/deploy/portal_check_daily_wrapper.sh"
sig = 'portal_check_daily_wrapper\.sh\b'
owner = "albert-scott"
project = "albert-scott"

[[row]]
name = "suite-daily"
where = "user"
schedule = "40 5 * * *"
command = "{doit} cron-run suite-daily -- /usr/bin/python3 {repo}/src/suite_run.py >> {root}/logs/suite-daily.log 2>&1"
path = "/usr/bin/python3"
sig = 'suite_run\.py\b'
owner = "thinker"
project = "do-it-v2"
max_runtime_s = 1800

[[row]]
name = "health-alarms"
where = "user"
schedule = "*/10 * * * *"
command = "{doit} cron-run health-alarms -- {doit} health-alarms >> {root}/logs/health-alarms.log 2>&1"
path = "{doit}"
sig = '\bdoit health-alarms(?=\s*>>|\s*(?:#.*)?$)'
owner = "thinker"
project = "do-it-v2"

