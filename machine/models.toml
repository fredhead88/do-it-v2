# models.claude-only.toml — the model map with no Codex in it.
#
# Install with `doit models use claude-only` (copies this file to $DOIT_ROOT/models.toml
# and records a `models-changed` event). Use it when the Codex weekly limit is gone, or
# when a root must run on the Claude seat alone. `doit models use mixed` restores the
# mixed map (models.example.toml).
#
# The principle, from the 2026-09-15 retro: Sonnet AUTHORS, the strongest sub-agent
# model JUDGES. The blind audits found real defects on every pilot run and are the
# shortest spawns; authors get reworked anyway, and this project already builds on
# Sonnet. Opus appears in exactly three judging seats, chosen on measured value —
# it is nobody's default (operator ruling). Fable is pane-only.
#
# `fallback` on a contract is what the wrapper re-dispatches on when the primary
# backend refuses for a reason that is the backend's, not the packet's (a Codex
# limit, a seat that cannot be reached). None are needed on a Claude-only map, so
# none are set; see models.example.toml for the shape.

[defaults]
backend = "seat"

[contracts.thinker]
backend = "pane"
model = "claude-opus-5-5"

[contracts.planner]
backend = "pane"
model = "claude-opus-5-5"

[contracts.executor]
backend = "pane"            # under a seat-only root the driver pane IS the Executor (S2)
model = "claude-sonnet-5-5"   # once the pane no longer types findings (change list a-1); until then, whoever drives

[contracts.spec-writer]
backend = "codex"
model = "gpt-6.1-sol"
fallback = { backend = "seat", model = "claude-sonnet-5-5" }   # Thinker 2026-10-18: operator-approved capacity plan (L-operator-0001 checks-redesign-20261018 item 4); Codex weekly 7% vs Claude 7d 21% on day 1
[contracts.builder]
# Operator 2026-10-12 ("massive push"): builders on Codex; Claude graders/reviewers judge them.
backend = "codex"
model = "gpt-6.1-sol"
effort = "high"
fallback = { backend = "seat", model = "claude-sonnet-5-5" }

[contracts.spec-auditor]
backend = "seat"
model = "claude-opus-5-5"     # one round ever; real findings every pilot run; ~9 min

[contracts.plan-auditor]
backend = "seat"
model = "claude-opus-5-5"     # three short spawns per charter; found the sibling red

[contracts.charter-reviewer]
backend = "seat"
model = "claude-opus-5-5"     # one per charter; the done-for-the-whole call

[contracts.grader]
backend = "seat"
model = "claude-sonnet-5-5"   # mechanical: re-runs the checker; the validator is ground truth

[contracts.reviewer]
backend = "seat"
model = "claude-sonnet-5-5"   # drives the deployed thing with the MCP browser

[contracts.probe]
backend = "codex"
model = "gpt-6.1-sol"
fallback = { backend = "seat", model = "claude-sonnet-5-5" }   # Thinker 2026-10-18: operator-approved capacity plan (L-operator-0001 checks-redesign-20261018 item 4); Codex weekly 7% vs Claude 7d 21% on day 1
[contracts.research]
# Thinker 2026-10-12 (operator go): first role on the ChatGPT plan. Seat fallback on refusal/quota.
backend = "codex"
model = "gpt-6.1-sol"
effort = "medium"
fallback = { backend = "seat", model = "claude-haiku-4-5-20251001" }

[contracts.reuse-scout]
backend = "seat"
model = "claude-sonnet-5-5"

# [weights] — retro step 9 (operator ask, 2026-09-15). Same shape and ratios as
# models.example.toml: see that file's comment for what these mean and why
# they are the same four numbers for every model named here.
[weights.claude-fable-5-1]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[weights.claude-sonnet-5]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[weights.claude-opus-5]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[weights.claude-haiku-4-5-20251001]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25
[weights.claude-opus-5-5]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[weights.claude-sonnet-5-5]
input = 1.0
output = 5.0
cache_read = 0.1
cache_creation = 1.25

[seats]
builder = 12   # 2026-10-15: 8->12 after CCX33 resize (8 vCPU, 30GB, 225G disk); was: 2026-10-12: 6->8; box is 4 cores / 15.6 GB with heavy swap, test runs are the memory risk
